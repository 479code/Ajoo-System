<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<title>Ajoo Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --surface-2:#FBFAF5; --border:#E3DECF;
  --ink:#20241F; --ink-soft:#5C635A; --muted:#8B9186;
  --accent:#0B6E82; --accent-ink:#FFFFFF; --accent-soft:#DFEEF0; --accent-strong:#075767;
  --gold:#B8791C; --gold-soft:#F7ECD8;
  --success:#2E7D46; --success-soft:#E1F2E5;
  --warning:#AD7A1E; --warning-soft:#FBF0D9;
  --danger:#B3372A; --danger-soft:#FBE7E3;
  --shadow:0 1px 2px rgba(32,36,31,.05), 0 6px 20px rgba(32,36,31,.07);
  --shadow-lg:0 8px 30px rgba(32,36,31,.14);
  --radius:16px; --radius-sm:10px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;}
html{color-scheme:light;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; color:var(--ink);}
.mono, .tabular{font-variant-numeric:tabular-nums; font-family:var(--font-mono);}
button{font:inherit; color:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.wrap{max-width:1080px; margin:0 auto; padding:0 20px 64px;}

.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.topbar-inner{max-width:1080px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:baseline; gap:9px; flex:0 0 auto;}
.brand h1{font-size:22px; font-weight:600; letter-spacing:-.01em;}
.brand span{font-size:12px; color:var(--muted); font-weight:500;}
.topbar-actions{display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap;}

.search{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:8px 14px; min-width:200px;
}
.search svg{flex:0 0 auto; opacity:.55;}
.search input{border:0; outline:0; background:transparent; color:var(--ink); font-size:16px; width:100%;}
.search input::placeholder{color:var(--muted);}

.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:999px; border:1px solid transparent;
  padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .08s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 12px; font-size:13px;}
.btn-icon{padding:8px; border-radius:999px; background:transparent; border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
.btn-icon:hover{background:var(--surface-2);}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none;}
.pill-admin{display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid var(--border); background:var(--surface); padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;}
.pill-admin.unlocked{background:var(--success-soft); color:var(--success); border-color:transparent;}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:24px 0 20px;}
@media (max-width:720px){ .stats{grid-template-columns:repeat(2,1fr);} }
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.stat .num{font-family:var(--font-display); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat .label{font-size:12.5px; color:var(--muted); margin-top:2px; font-weight:500;}

.chips{display:flex; gap:8px; margin:4px 0 18px; flex-wrap:wrap;}
.chip{
  padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .15s ease, transform .1s ease;
  display:flex; flex-direction:column; gap:12px;
}
.card:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-top h3{font-size:17px; font-weight:600;}
.card-amount{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:500;}
.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
.badge-active{background:var(--accent-soft); color:var(--accent-strong);}
.badge-done{background:var(--success-soft); color:var(--success);}
.badge-archived{background:var(--surface-2); color:var(--muted); border:1px solid var(--border);}

.progress{height:6px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden;}
.progress > i{display:block; height:100%; background:var(--accent); border-radius:999px;}

.now-row{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.avatar{
  width:34px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:700; color:#fff; flex:0 0 auto; font-family:var(--font-body);
}
.now-row .who{min-width:0; flex:1;}
.now-row .who .name{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.now-row .who .month{font-size:12px; color:var(--muted);}
.now-row .ratio{font-size:12px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; flex:0 0 auto;}
.card-empty-now{font-size:13px; color:var(--muted); font-style:italic;}

.empty{text-align:center; padding:64px 20px; color:var(--muted);}
.empty h3{color:var(--ink); font-size:19px; margin-bottom:8px;}
.empty p{max-width:380px; margin:0 auto 18px; font-size:14px;}

.back{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--ink-soft); background:none; border:0; cursor:pointer; padding:0; margin-bottom:14px;}
.back:hover{color:var(--ink);}
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.detail-head h2{font-size:26px; font-weight:600;}
.detail-sub{font-size:13.5px; color:var(--muted); margin-top:4px;}
.detail-actions{display:flex; gap:8px; flex-wrap:wrap;}

.hero{
  background:linear-gradient(155deg, var(--gold-soft), var(--surface) 55%); border:1px solid var(--border);
  border-radius:var(--radius); padding:22px; margin-bottom:26px; box-shadow:var(--shadow);
}
.hero-eyebrow{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--gold);}
.hero-collector{display:flex; align-items:center; gap:14px; margin:10px 0 16px;}
.hero-collector .avatar{width:52px; height:52px; font-size:17px;}
.hero-collector h3{font-size:22px; font-weight:600;}
.hero-collector .month{font-size:13.5px; color:var(--ink-soft); margin-top:2px;}
.hero-complete{font-size:15px; color:var(--ink-soft); padding:6px 0;}

.paylist{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:8px; margin:14px 0 16px;}
.paychip{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); font-size:13px; cursor:pointer; text-align:left;
}
.paychip:hover{border-color:var(--accent);}
.paychip .avatar{width:24px; height:24px; font-size:10px;}
.paychip .pname{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
.pstatus{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; flex:0 0 auto;}
.pstatus-confirmed{background:var(--success-soft); color:var(--success);}
.pstatus-pending{background:var(--warning-soft); color:var(--warning);}

.hero-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:6px; border-top:1px dashed var(--border);}
.confirm-inline{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--warning-soft); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;}
.confirm-inline p{margin:0; font-size:13px; color:var(--ink); font-weight:600;}

.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:26px 0 10px;}

.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tr.row-current{background:var(--accent-soft);}
tr.row-done td{color:var(--ink-soft);}
.row-who{display:flex; align-items:center; gap:9px;}
.row-status{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;}
.row-status-done{background:var(--success-soft); color:var(--success);}
.row-status-current{background:var(--accent-soft); color:var(--accent-strong);}
.row-status-upcoming{background:var(--surface-2); color:var(--muted); border:1px solid var(--border);}

.roster{display:flex; flex-direction:column; gap:8px;}
.roster-item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px;}
.roster-item .name{flex:1; min-width:0; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.roster-item .tag{font-size:11px; color:var(--muted);}
.roster-actions{display:flex; gap:4px;}
.iconbtn{background:none; border:1px solid var(--border); border-radius:8px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
.iconbtn:hover{background:var(--surface-2); color:var(--ink);}
.iconbtn[disabled]{opacity:.3; cursor:not-allowed;}

.inline-form{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
input[type=text], input[type=number], input[type=month], input[type=tel], input[type=password]{
  border:1px solid var(--border); border-radius:9px; padding:10px 11px; font-size:16px; background:var(--surface); color:var(--ink); font-family:inherit; width:100%;
}
input:focus{border-color:var(--accent);}

.overlay{position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;}
.modal{background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-lg); width:100%; max-width:520px; padding:26px;}
.modal.modal-sm{max-width:360px;}
.modal h2{font-size:21px; margin-bottom:4px;}
.modal .sub{font-size:13px; color:var(--muted); margin-bottom:18px;}
.modal-fields{display:flex; flex-direction:column; gap:14px;}
.modal-fields .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.participant-draft{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
.participant-row-wrap{background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:7px 10px;}
.participant-row{display:flex; align-items:center; gap:8px;}
.participant-row .n{font-size:11px; color:var(--muted); width:16px; text-align:center; flex:0 0 auto; font-weight:700;}
.participant-row .name{flex:1; font-size:13.5px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.add-row{display:flex; gap:8px; margin-top:8px;}
.add-row input{flex:1;}
.joint-badge{display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); border-radius:999px; padding:2px 8px; margin-left:6px; white-space:nowrap; vertical-align:middle;}
.copayer-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding-left:24px;}
.copayer-chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 6px 4px 11px; font-size:12.5px; font-weight:500;}
.copayer-chip button{background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px; line-height:1; padding:2px 4px;}
.copayer-chip button:hover{color:var(--danger);}
.paygroup{grid-column:1 / -1; border:1px dashed var(--border); border-radius:var(--radius-sm); padding:9px 10px; background:var(--surface-2);}
.paygroup-label{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:7px; display:flex; align-items:center; gap:5px;}
.paygroup-chips{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:8px;}
.paygroup-chips .paychip{background:var(--surface);}
.hero-money{margin:2px 0 16px;}
.hero-money-label{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:6px;}
.pct-muted{color:var(--muted); font-weight:500;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap;}
.hint{font-size:12px; color:var(--muted); margin-top:4px;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg);
  z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.boot-loading{text-align:center; padding:80px 20px; color:var(--muted); font-size:14px;}

/* ---------- mobile ---------- */
@media (max-width:640px){
  .wrap{padding:0 14px 48px;}
  .topbar-inner{padding:12px 14px; gap:10px;}
  .brand span{display:none;}
  .search{min-width:0; flex:1 1 140px; padding:8px 12px;}
  .stat{padding:13px 14px;}
  .stat .num{font-size:21px;}
  .grid{grid-template-columns:1fr; gap:10px;}
  .card{padding:14px; gap:10px;}
  .hero{padding:16px;}
  .hero-collector{gap:10px;}
  .hero-collector .avatar{width:44px; height:44px;}
  .hero-collector h3{font-size:19px;}
  .hero-foot{flex-direction:column; align-items:stretch;}
  .hero-foot .btn{width:100%; justify-content:center;}
  .confirm-inline{flex-direction:column; align-items:stretch;}
  .confirm-inline .btn{width:100%; justify-content:center;}
  .paylist{grid-template-columns:1fr;}
  .paygroup-chips{grid-template-columns:1fr;}
  .table-wrap table{min-width:0; font-size:12.5px;}
  th, td{padding:8px 8px;}
  .overlay{padding:0; align-items:flex-end;}
  .modal{max-width:none; border-radius:16px 16px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto;}
  .modal.modal-sm{max-width:none;}
  .modal-fields .row2{grid-template-columns:1fr;}
  .modal-actions{justify-content:stretch;}
  .modal-actions .btn{flex:1 1 auto; justify-content:center;}
  .copayer-list{padding-left:8px;}
  .inline-form{flex-direction:column; align-items:stretch;}
  .inline-form .btn{width:100%; justify-content:center;}
  .add-row{flex-direction:column;}
  .add-row .btn{width:100%; justify-content:center;}
  .detail-head{gap:10px;}
  .detail-actions{width:100%;}
  .detail-actions .btn{flex:1 1 auto; justify-content:center;}
}
</style>
</head>
<body>
<div id="app"><div class="boot-loading">Loading your ledger…</div></div>
<div class="toast" id="ajoo-toast"></div>

<script>
(function(){
  "use strict";

  // Emoji built from their numeric code points instead of pasted as literal
  // glyphs. Google's Apps Script editor has a known bug where 4-byte
  // ("astral") Unicode characters — which is what most emoji are — get
  // mangled into replacement boxes when this file's text is pasted in. Since
  // these are computed from plain numbers, that copy/paste step can't touch
  // them, regardless of the file's own encoding.
  var SYM = {
    crown: String.fromCodePoint(0x1F478),      // U+1F478 princess/crown
    dancer: String.fromCodePoint(0x1F483),     // U+1F483 dancer
    skinLight: String.fromCodePoint(0x1F3FB),  // U+1F3FB skin-tone modifier
    party: String.fromCodePoint(0x1F389),      // U+1F389 party popper
    person: String.fromCodePoint(0x1F464),     // U+1F464 bust in silhouette
    people: String.fromCodePoint(0x1F465),     // U+1F465 busts in silhouette
    chart: String.fromCodePoint(0x1F4CA),      // U+1F4CA bar chart
    locked: String.fromCodePoint(0x1F512),     // U+1F512 locked padlock
    unlocked: String.fromCodePoint(0x1F513),   // U+1F513 unlocked padlock
    check: String.fromCodePoint(0x2705)        // U+2705 check mark button
  };
  var DANCER_TAG = SYM.crown + SYM.dancer + SYM.skinLight; // crown+dancer+skin-tone combo

  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var AVATAR_COLORS = ["#0B6E82","#B8791C","#7A6FD1","#C4548C","#2E7D46","#B3372A","#3E7CB1","#8A6D3B"];
  var PIN_STORAGE_KEY = "ajooAdminPin";
  var REFRESH_MS = 25000;

  var LEDGER = { batches: [], pinSet: false, paymentDetails: { accountNumber: "", accountName: "", bankName: "" } };
  var BUSY = false;
  var LOADED_ONCE = false;
  var ADMIN = { unlocked: false, pin: null };

  var UI = {
    view: "home",
    batchId: null,
    search: "",
    filter: "all",
    showNewBatch: false,
    newBatchDraft: null,
    addParticipantOpenFor: null,
    addParticipantDraft: { name: "", phone: "", subNames: [], copayerOpen: false },
    confirmCollectFor: null,
    confirmDeleteFor: null,
    showAdminModal: false,
    adminPinInput: "",
    pendingAction: null,
    showEditBatch: false,
    editBatchDraft: null,
    showChangePin: false,
    changePinDraft: { newPin: "", confirmPin: "" },
    pendingCustomAction: null,
    showPaymentDetails: false,
    paymentDetailsDraft: { accountNumber: "", accountName: "", bankName: "" },
    showShareFor: null,
    shareStyle: "decorative"
  };

  /* ---------- utils ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }
  function money(n){
    var v = Math.round(Number(n) || 0);
    return "₦" + v.toLocaleString();
  }
  function monthLabel(startMonth, offset){
    var parts = (startMonth || "").split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1;
    if (isNaN(y) || isNaN(m)) return "Month " + (offset + 1);
    var total = m + offset;
    y += Math.floor(total / 12);
    var mi = ((total % 12) + 12) % 12;
    return MONTH_NAMES[mi] + " " + y;
  }
  function defaultNextMonth(){
    var d = new Date();
    var totalMonths = d.getFullYear() * 12 + d.getMonth() + 1; // + 1 = next month, 0-based
    var y = Math.floor(totalMonths / 12);
    var m = (totalMonths % 12) + 1; // back to 1-based
    return y + "-" + (m < 10 ? "0" + m : m);
  }
  function initials(name){
    var parts = String(name || "?").trim().split(/\s+/).slice(0,2);
    return parts.map(function(w){ return w.charAt(0).toUpperCase(); }).join("") || "?";
  }
  function avatarColor(id){
    var h = 0;
    for (var i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function avatar(p, size){
    return '<span class="avatar" style="background:' + avatarColor(p.id) + (size?';width:'+size+'px;height:'+size+'px':'') + '">' + esc(initials(p.name)) + '</span>';
  }
  function findBatch(id){
    return LEDGER.batches.find(function(b){ return b.id === id; });
  }
  function participantById(batch, id){
    return batch.participants.find(function(p){ return p.id === id; }) || { id: id, name: "(removed)" };
  }
  function isComplete(b){ return b.queue.length === 0; }
  function currentCollectorId(b){ return b.queue.length ? b.queue[0] : null; }
  function confirmedCount(b){
    var vals = Object.keys(b.currentPayments || {}).map(function(k){ return b.currentPayments[k]; });
    return vals.filter(function(v){ return v === "confirmed"; }).length;
  }
  function currentTotalUnits(b){
    return Object.keys(b.currentPayments || {}).length;
  }
  /* A "slot" (participant) is normally paid by one person, but can be shared
     by two or more co-payers who together count as that one rotation
     position. payerUnits mirrors the server's payerUnits_: whoever actually
     owes/pays money for a slot — either its list of sub-payers, or (for a
     normal solo slot) the slot itself. */
  function payerUnits(p){
    if (p.subPayers && p.subPayers.length) return p.subPayers;
    return [{ id: p.id, name: p.name, phone: p.phone, amount: undefined }];
  }
  function unitAmount(b, u){
    return (u.amount === undefined || u.amount === null) ? b.amount : (Number(u.amount) || 0);
  }
  function totalPayerUnits(b){
    var n = 0;
    b.participants.forEach(function(p){ n += payerUnits(p).length; });
    return n;
  }
  function roundMoneyStats(b){
    var expected = 0, confirmedAmt = 0;
    var cp = b.currentPayments || {};
    b.participants.forEach(function(p){
      payerUnits(p).forEach(function(u){
        if (!(u.id in cp)) return;
        var amt = unitAmount(b, u);
        expected += amt;
        if (cp[u.id] === "confirmed") confirmedAmt += amt;
      });
    });
    return { expected: expected, confirmed: confirmedAmt, pct: expected ? Math.round(confirmedAmt / expected * 100) : 0 };
  }
  function cyclePct(b){
    return b.participants.length ? Math.round(b.history.length / b.participants.length * 100) : 0;
  }
  function toast(msg){
    var el = document.getElementById("ajoo-toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove("show"); }, 3000);
  }
  function withFocusPreserved(fn){
    var active = document.activeElement;

    var start, end;
    if (active && "selectionStart" in active) { try { start = active.selectionStart; end = active.selectionEnd; } catch(e){} }
    fn();
    if (id) {
      var el = document.getElementById(id);
      if (el) {
        el.focus();
        if (start != null && "setSelectionRange" in el) { try { el.setSelectionRange(start, end); } catch(e){} }
      }
    }
  }
  function isTypingInField(){

      runner[fnName].apply(runner, args || []);
    });
  }

  /* ---------- ledger mutations ---------- */
  function mutate(action, payload, successMsg){
    if (BUSY) return;
    if (!ADMIN.unlocked) {
      UI.pendingAction = { action: action, payload: payload, successMsg: successMsg };
      openAdminModal();
      return;
    }
    performMutate(action, payload, successMsg);
  }
  function performMutate(action, payload, successMsg){
    BUSY = true;
    callServer("api_mutate", [action, ADMIN.pin, payload || {}]).then(function(res){
      BUSY = false;
      if (res && res.error) {
        if (res.error === "wrong_pin" || res.error === "pin_not_set") {
          ADMIN.unlocked = false; ADMIN.pin = null;
          try { localStorage.removeItem(PIN_STORAGE_KEY); } catch(e){}
          toast("Your admin PIN didn't work — enter it again.");
          UI.pendingAction = { action: action, payload: payload, successMsg: successMsg };
          openAdminModal();
        } else {
          toast(res.message || "Something went wrong.");
          render();
        }
        return;
      }
      LEDGER = res;
      if (successMsg) toast(successMsg);
      render();
    }).catch(function(){
      BUSY = false;
      toast("Server error — please try again.");
      render();
    });
  }

  /* ---------- optimistic payment toggle ----------
     Confirming a payment happens far more often than any other action, so it
     flips the chip on screen immediately (before the server round-trip
     returns) and reconciles with the server's answer after — instead of
     leaving the tap looking unresponsive while it waits. If the request
     fails, the optimistic flip is rolled back. */
  function togglePaymentOptimistic(batchId, payerId){
    if (!ADMIN.unlocked) {
      mutate("togglePayment", { batchId: batchId, payerId: payerId });
      return;
    }
    if (BUSY) return;
    var b = findBatch(batchId);
    if (!b || !b.currentPayments || !(payerId in b.currentPayments)) {
      mutate("togglePayment", { batchId: batchId, payerId: payerId });
      return;
    }
    var prevStatus = b.currentPayments[payerId];
    b.currentPayments[payerId] = prevStatus === "confirmed" ? "pending" : "confirmed";
    render();

    BUSY = true;
    callServer("api_mutate", ["togglePayment", ADMIN.pin, { batchId: batchId, payerId: payerId }]).then(function(res){
      BUSY = false;
      if (res && res.error) {
        var reverting = findBatch(batchId);
        if (reverting) reverting.currentPayments[payerId] = prevStatus;
        if (res.error === "wrong_pin" || res.error === "pin_not_set") {
          ADMIN.unlocked = false; ADMIN.pin = null;
          try { localStorage.removeItem(PIN_STORAGE_KEY); } catch(e){}
          toast("Your admin PIN didn't work — enter it again.");
          UI.pendingAction = { action: "togglePayment", payload: { batchId: batchId, payerId: payerId } };
          openAdminModal();
        } else {
          toast(res.message || "Could not update — try again.");
          render();
        }
        return;
      }
      LEDGER = res;
      render();
    }).catch(function(){
      BUSY = false;
      var reverting2 = findBatch(batchId);
      if (reverting2) reverting2.currentPayments[payerId] = prevStatus;
      toast("Server error — please try again.");
      render();
    });
  }

  function copyToClipboard(text){
    function fallback(){
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta);
        toast(ok ? "Copied to clipboard." : "Couldn't copy — select the text above and copy it manually.");
      } catch(e){
        toast("Couldn't copy — select the text above and copy it manually.");
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast("Copied to clipboard."); }).catch(fallback);
    } else {
      fallback();
    }
  }

  /* ---------- WhatsApp share text ---------- */
  function shortAmount(n){
    n = Math.round(Number(n) || 0);
    if (n >= 1000 && n % 1000 === 0) return (n / 1000) + "k";
    return n.toLocaleString();
  }
  function buildScheduleRows(b){
    var rows = [];
    b.history.forEach(function(hEntry){
      rows.push({ label: hEntry.monthLabel, collectorId: hEntry.collectorId, done: true, payments: hEntry.payments || {} });
    });
    if (b.queue.length) {
      rows.push({ label: monthLabel(b.startMonth, b.history.length), collectorId: b.queue[0], done: false, payments: b.currentPayments || {} });
      b.queue.slice(1).forEach(function(pid, i){
        rows.push({ label: monthLabel(b.startMonth, b.history.length + 1 + i), collectorId: pid, done: false, payments: null });
      });
    }
    return rows;
  }
  function buildShareText(b, style, pd){
    var rows = buildScheduleRows(b);
    var startLabel = monthLabel(b.startMonth, 0);
    var endLabel = monthLabel(b.startMonth, Math.max(b.participants.length - 1, 0));
    var startYear = startLabel.split(" ").pop();
    var endYear = endLabel.split(" ").pop();
    var startPart = startYear === endYear ? startLabel.split(" ")[0] : startLabel;
    var dateRange = startPart + " to " + endLabel;
    var letters = "ABCDEFGH";
    var lines = [];
    lines.push("*" + b.name + "*");
    lines.push("*" + dateRange + "*");
    lines.push("");
    var cp = cyclePct(b);
    lines.push(style === "decorative" ? (SYM.chart + " " + b.history.length + " of " + b.participants.length + " rounds complete (" + cp + "%)") : (b.history.length + "/" + b.participants.length + " rounds complete (" + cp + "%)"));
    lines.push("");
    rows.forEach(function(r, i){
      var p = participantById(b, r.collectorId);
      var units = payerUnits(p);
      if (style === "decorative") {
        lines.push("(" + (i + 1) + ") " + r.label);
        if (units.length > 1) {
          units.forEach(function(u, ui){
            var amtU = shortAmount(unitAmount(b, u));
            var paidU = !!(r.payments && r.payments[u.id] === "confirmed");
            lines.push("(" + letters.charAt(ui) + ")" + u.name + " " + amtU + DANCER_TAG + (paidU ? SYM.check : ""));
          });
        } else {
          var amt = shortAmount(unitAmount(b, units[0]));
          var paid = r.payments ? r.payments[units[0].id] === "confirmed" : r.done;
          lines.push(p.name + " " + amt + DANCER_TAG + (paid ? SYM.check : ""));
        }
      } else {
        if (units.length > 1) {
          lines.push((i + 1) + ". " + r.label + " — " + p.name);
          units.forEach(function(u, ui){
            var amtU2 = shortAmount(unitAmount(b, u));
            var paidU2 = !!(r.payments && r.payments[u.id] === "confirmed");
            lines.push("   (" + letters.charAt(ui) + ") " + u.name + " — ₦" + amtU2 + " — " + (paidU2 ? "PAID" : "PENDING"));
          });
        } else {
          var amt2 = shortAmount(unitAmount(b, units[0]));
          var paid2 = r.payments ? r.payments[units[0].id] === "confirmed" : r.done;
          lines.push((i + 1) + ". " + r.label + " — " + p.name + " — ₦" + amt2 + " — " + (paid2 ? "PAID" : "PENDING"));
        }
      }
      lines.push("");
    });
    if (pd && (pd.accountNumber || pd.accountName || pd.bankName)) {
      if (style === "decorative") {
        if (pd.accountNumber) lines.push("*" + pd.accountNumber + "*");
        if (pd.accountName) lines.push("*" + pd.accountName + "*");
        if (pd.bankName) lines.push("*" + pd.bankName + "*");
      } else {
        if (pd.accountNumber) lines.push("Account: " + pd.accountNumber);
        if (pd.accountName) lines.push("Name: " + pd.accountName);
        if (pd.bankName) lines.push("Bank: " + pd.bankName);
      }
    }
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  function computeHomeStats(){
    var active = LEDGER.batches.filter(function(b){ return !b.archived && !isComplete(b); });
    var totalPeople = 0, expected = 0, confirmed = 0, totalDue = 0;
    active.forEach(function(b){
      totalPeople += totalPayerUnits(b);
      expected += b.amount * b.participants.length;
      confirmed += confirmedCount(b);
      totalDue += currentTotalUnits(b);
    });
    return { activeCount: active.length, totalPeople: totalPeople, expected: expected, confirmed: confirmed, totalDue: totalDue };
  }

  function renderHome(){
    var stats = computeHomeStats();

    h += '<div class="stat"><div class="num">' + stats.activeCount + '</div><div class="label">Active batches</div></div>';
    h += '<div class="stat"><div class="num">' + stats.totalPeople + '</div><div class="label">People contributing</div></div>';
    h += '<div class="stat"><div class="num">' + money(stats.expected) + '</div><div class="label">Expected this cycle</div></div>';
    h += '<div class="stat"><div class="num">' + stats.confirmed + '/' + stats.totalDue + '</div><div class="label">Confirmed this month</div></div>';
    h += '</div>';

    h += '<div class="chips">';
    [["all","All"],["active","Active"],["completed","Completed"],["archived","Archived"]].forEach(function(f){

        h += '<button class="btn btn-danger btn-sm" data-action="request-delete-batch" data-batch="' + b.id + '">Delete</button>';

  function renderHero(b, complete){
    var h = '<div class="hero">';
    if (complete) {
      h += '<div class="hero-eyebrow">Cycle complete</div>';
      h += '<div class="hero-complete">All ' + b.participants.length + ' members have collected their share. ' + SYM.party + '</div>';
    } else {
      var collector = participantById(b, currentCollectorId(b));
      var label = monthLabel(b.startMonth, b.history.length);
      var cc = confirmedCount(b), total = currentTotalUnits(b);
      var moneyStats = roundMoneyStats(b);
      h += '<div class="hero-eyebrow">' + label + ' · round ' + (b.history.length + 1) + ' of ' + b.participants.length + ' · ' + cyclePct(b) + '% of cycle complete</div>';
      h += '<div class="hero-collector">' + avatar(collector, 52) + '<div><h3>' + esc(collector.name) + ' is collecting</h3><div class="month">' + money(moneyStats.expected) + ' expected this round</div></div></div>';
      h += '<div class="hero-money"><div class="progress"><i style="width:' + moneyStats.pct + '%"></i></div><div class="hero-money-label"><span>' + money(moneyStats.confirmed) + ' confirmed of ' + money(moneyStats.expected) + '</span><span>' + moneyStats.pct + '%</span></div></div>';
      h += '<div class="paylist">';
      b.participants.forEach(function(p){
        var units = payerUnits(p);
        if (units.length > 1) {
          h += '<div class="paygroup"><div class="paygroup-label">' + SYM.people + ' ' + esc(p.name) + ' — shared slot</div><div class="paygroup-chips">';
          units.forEach(function(u){
            var status = (b.currentPayments || {})[u.id] || "pending";
            var confirmedFlag = status === "confirmed";
            h += '<div class="paychip" data-action="toggle-payment" data-batch="' + b.id + '" data-participant="' + p.id + '" data-payer="' + u.id + '" title="' + esc(u.name) + ' · ' + money(unitAmount(b, u)) + '">' + avatar(u, 24) + '<span class="pname">' + esc(u.name) + ' · ' + money(unitAmount(b, u)) + '</span><span class="pstatus pstatus-' + status + '">' + (confirmedFlag ? "Confirmed" : "Pending") + '</span></div>';
          });
          h += '</div></div>';
        } else {
          var u0 = units[0];
          var status0 = (b.currentPayments || {})[u0.id] || "pending";
          var confirmedFlag0 = status0 === "confirmed";
          h += '<div class="paychip" data-action="toggle-payment" data-batch="' + b.id + '" data-participant="' + p.id + '" data-payer="' + u0.id + '">' + avatar(p, 24) + '<span class="pname">' + esc(p.name) + '</span><span class="pstatus pstatus-' + status0 + '">' + (confirmedFlag0 ? "Confirmed" : "Pending") + '</span></div>';
        }
      });
      h += '</div>';
      h += '<div class="hero-foot">';
      h += '<span style="font-size:13px;color:var(--ink-soft);font-weight:600">' + cc + ' of ' + total + ' payments confirmed</span>';
      if (UI.confirmCollectFor === b.id) {
        h += '<div class="confirm-inline"><p>Only ' + cc + ' of ' + total + ' confirmed — mark as collected anyway?</p><button class="btn btn-primary btn-sm" data-action="mark-collected-confirm" data-batch="' + b.id + '">Yes, mark collected</button><button class="btn btn-ghost btn-sm" data-action="mark-collected-cancel">Cancel</button></div>';
      } else {
        h += '<button class="btn btn-primary" data-action="mark-collected-request" data-batch="' + b.id + '">Mark pot collected → move to next month</button>';
      }
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderScheduleTable(b){
    var rows = [];
    b.history.forEach(function(hEntry, i){
      rows.push({ index:i, status:"done", collectorId:hEntry.collectorId, monthLabel:hEntry.monthLabel, payments:hEntry.payments });
    });
    if (b.queue.length) {
      rows.push({ index:b.history.length, status:"current", collectorId:b.queue[0], monthLabel:monthLabel(b.startMonth,b.history.length), payments:b.currentPayments });
      b.queue.slice(1).forEach(function(pid,i){
        rows.push({ index:b.history.length+1+i, status:"upcoming", collectorId:pid, monthLabel:monthLabel(b.startMonth,b.history.length+1+i), payments:null });
      });
    }
    var h = '<div class="table-wrap"><table><thead><tr><th>Month</th><th>Collector</th><th>Payments</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var p = participantById(b, r.collectorId);
      var rowCls = r.status === "current" ? "row-current" : (r.status === "done" ? "row-done" : "");
      h += '<tr class="' + rowCls + '"><td class="mono">' + r.monthLabel + '</td>';
      h += '<td><div class="row-who">' + avatar(p, 22) + esc(p.name) + '</div></td>';
      if (r.payments) {
        var vals = Object.keys(r.payments).map(function(k){ return r.payments[k]; });
        var c = vals.filter(function(v){ return v === "confirmed"; }).length;
        var pct = vals.length ? Math.round(c / vals.length * 100) : 0;
        h += '<td class="tabular">' + c + ' / ' + vals.length + ' <span class="pct-muted">(' + pct + '%)</span></td>';
      } else {
        h += '<td>—</td>';
      }
      var statusLabel = r.status === "done" ? "Done" : (r.status === "current" ? "Current" : "Upcoming");
      h += '<td><span class="row-status row-status-' + r.status + '">' + statusLabel + '</span></td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  function renderRoster(b){
    var h = '<div class="roster">';
    var upcoming = b.queue.slice(1);
    b.participants.forEach(function(p){
      var inHistory = b.history.some(function(hE){ return hE.collectorId === p.id; });
      var isCurrent = b.queue.length && b.queue[0] === p.id;
      var upIdx = upcoming.indexOf(p.id);
      var tag = inHistory ? "Collected" : (isCurrent ? "Collecting now" : "Queue position " + (upIdx + 2));
      var jointBadge = (p.subPayers && p.subPayers.length) ? '<span class="joint-badge">' + SYM.people + ' ' + payerUnits(p).length + '</span>' : '';
      h += '<div class="roster-item">' + avatar(p, 30) + '<div class="name">' + esc(p.name) + jointBadge + '</div><div class="tag">' + tag + '</div>';
      if (upIdx !== -1) {
        h += '<div class="roster-actions">';
        h += '<button class="iconbtn" data-action="move-participant" data-batch="' + b.id + '" data-participant="' + p.id + '" data-dir="-1"' + (upIdx === 0 ? " disabled" : "") + ' aria-label="Move up">↑</button>';
        h += '<button class="iconbtn" data-action="move-participant" data-batch="' + b.id + '" data-participant="' + p.id + '" data-dir="1"' + (upIdx === upcoming.length - 1 ? " disabled" : "") + ' aria-label="Move down">↓</button>';
        h += '<button class="iconbtn" data-action="remove-participant" data-batch="' + b.id + '" data-participant="' + p.id + '" aria-label="Remove">×</button>';
        h += '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
    if (UI.addParticipantOpenFor === b.id) {
      var apd = UI.addParticipantDraft;
      h += '<div class="inline-form">';
      h += '<input id="add-p-name" data-scope="addParticipant" data-field="name" type="text" placeholder="Full name" value="' + esc(apd.name) + '">';
      h += '<input id="add-p-phone" data-scope="addParticipant" data-field="phone" type="tel" placeholder="Phone (optional)" value="' + esc(apd.phone) + '">';
      h += '<button class="btn btn-primary btn-sm" data-action="add-participant-submit" data-batch="' + b.id + '">Add</button>';
      h += '<button class="btn btn-ghost btn-sm" data-action="add-participant-cancel">Cancel</button>';
      if (!apd.copayerOpen) {
        h += '<button class="btn btn-ghost btn-sm" data-action="add-copayer-open">+ Co-payer</button>';
      }
      h += '</div>';
      if (apd.subNames.length) {
        h += '<div class="copayer-list">';
        apd.subNames.forEach(function(n, si){
          h += '<span class="copayer-chip">' + esc(n) + '<button data-action="add-copayer-remove" data-subidx="' + si + '" aria-label="Remove co-payer">×</button></span>';
        });
        h += '</div>';
      }
      if (apd.copayerOpen) {
        h += '<div class="add-row"><input id="add-p-copayer" type="text" placeholder="Co-payer name and press Enter"><button class="btn btn-ghost btn-sm" data-action="add-copayer-add">Add</button><button class="btn btn-ghost btn-sm" data-action="add-copayer-cancel">Done</button></div>';
      }
      if (apd.subNames.length || apd.copayerOpen) {
        h += '<div class="hint">This will be one shared rotation position — each person confirms their own share.</div>';
      }
    } else {
      h += '<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-action="add-participant-open" data-batch="' + b.id + '">+ Add member</button></div>';
    }
    return h;

  /* ---------- events ---------- */
  document.addEventListener("input", function(e){
    var t = e.target;
    var scope = t.getAttribute && t.getAttribute("data-scope");
    var field = t.getAttribute && t.getAttribute("data-field");
    if (!scope || !field) return;
    if (scope === "ui") { UI[field] = t.value; withFocusPreserved(render); }
    else if (scope === "newBatch") { UI.newBatchDraft[field] = t.value; }
    else if (scope === "addParticipant") { UI.addParticipantDraft[field] = t.value; }
    else if (scope === "admin") { UI.adminPinInput = t.value; }
    else if (scope === "editBatch") { UI.editBatchDraft[field] = t.value; }
    else if (scope === "changePin") { UI.changePinDraft[field] = t.value; }
    else if (scope === "paymentDetails") { UI.paymentDetailsDraft[field] = t.value; }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target && e.target.id === "nb-newname") {
      e.preventDefault(); addDraftParticipant();
    }
    if (e.key === "Enter" && e.target && e.target.id === "add-p-name") {
      e.preventDefault();
      var b = document.querySelector('[data-action="add-participant-submit"]');
      if (b) b.click();
    }
    if (e.key === "Enter" && e.target && e.target.id === "nb-copayer-input") {
      e.preventDefault();
      var nbcb = document.querySelector('[data-action="nb-copayer-add"]');
      if (nbcb) nbcb.click();
    }
    if (e.key === "Enter" && e.target && e.target.id === "add-p-copayer") {
      e.preventDefault();
      var apcb = document.querySelector('[data-action="add-copayer-add"]');
      if (apcb) apcb.click();
    }
    if (e.key === "Enter" && e.target && e.target.id === "admin-pin-input") {
      e.preventDefault(); submitAdminPin();
    }
    if (e.key === "Enter" && e.target && e.target.id === "cp-confirm") {
      e.preventDefault(); submitChangePin();
    }
    if (e.key === "Escape") {
      if (UI.showNewBatch) { UI.showNewBatch = false; render(); }
      if (UI.showAdminModal) closeAdminModal();
      if (UI.showEditBatch) { UI.showEditBatch = false; render(); }
      if (UI.showChangePin) { UI.showChangePin = false; render(); }
      if (UI.showPaymentDetails) { UI.showPaymentDetails = false; render(); }
      if (UI.showShareFor) { UI.showShareFor = null; render(); }
    }
  });

  document.addEventListener("click", function(e){
    var overlayEl = e.target.closest('[data-action="modal-overlay"]');
    if (overlayEl && e.target === overlayEl) {
      if (UI.showAdminModal) closeAdminModal();
      else if (UI.showEditBatch) { UI.showEditBatch = false; render(); }
      else if (UI.showChangePin) { UI.showChangePin = false; render(); }
      else if (UI.showPaymentDetails) { UI.showPaymentDetails = false; render(); }
      else if (UI.showShareFor) { UI.showShareFor = null; render(); }
      else { UI.showNewBatch = false; render(); }
      return;
    }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var batchId = el.getAttribute("data-batch") || el.getAttribute("data-id");

    switch (action) {
      case "refresh":
        refreshLedger().then(function(){ toast("Refreshed."); });
        break;
      case "enter-admin":
        UI.pendingAction = null;
        openAdminModal();
        break;
      case "exit-admin":
        exitAdminMode();
        break;
      case "admin-cancel":
        closeAdminModal();
        break;
      case "admin-submit":
        submitAdminPin();
        break;
      case "open-batch":
        UI.view = "batch"; UI.batchId = batchId; UI.confirmCollectFor = null; UI.confirmDeleteFor = null; UI.addParticipantOpenFor = null;
        render(); window.scrollTo(0,0);
        break;
      case "go-home":
        UI.view = "home"; render();
        break;
      case "filter":
        UI.filter = el.getAttribute("data-value"); render();
        break;
      case "new-batch-open":
        UI.newBatchDraft = { name: "", amount: "", startMonth: defaultNextMonth(), participants: [], copayerFor: null };
        UI.showNewBatch = true; render();
        setTimeout(function(){ var i = document.getElementById("nb-name"); if (i) i.focus(); }, 0);
        break;
      case "new-batch-cancel":
        UI.showNewBatch = false; render();
        break;
      case "nb-add":
        addDraftParticipant();
        break;
      case "nb-remove":
        UI.newBatchDraft.participants.splice(parseInt(el.getAttribute("data-idx"),10), 1);
        render();
        break;
      case "nb-copayer-open":
        UI.newBatchDraft.copayerFor = parseInt(el.getAttribute("data-idx"),10);
        render();
        setTimeout(function(){ var i = document.getElementById("nb-copayer-input"); if (i) i.focus(); }, 0);
        break;
      case "nb-copayer-cancel":
        UI.newBatchDraft.copayerFor = null; render();
        break;
      case "nb-copayer-add": {
        var cpIdx = parseInt(el.getAttribute("data-idx"),10);
        var cpInput2 = document.getElementById("nb-copayer-input");
        var cpName2 = cpInput2 ? cpInput2.value.trim() : "";
        if (!cpName2) break;
        var row = UI.newBatchDraft.participants[cpIdx];
        if (!row) break;
        row.subNames = row.subNames || [];
        row.subNames.push(cpName2);
        render();
        setTimeout(function(){ var i = document.getElementById("nb-copayer-input"); if (i) i.focus(); }, 0);
        break;
      }
      case "nb-copayer-remove": {
        var rIdx = parseInt(el.getAttribute("data-idx"),10);
        var sIdx = parseInt(el.getAttribute("data-subidx"),10);
        var r2 = UI.newBatchDraft.participants[rIdx];
        if (r2 && r2.subNames) r2.subNames.splice(sIdx, 1);
        render();
        break;
      }
      case "nb-move": {
        var idx = parseInt(el.getAttribute("data-idx"),10);
        var dir = parseInt(el.getAttribute("data-dir"),10);
        var arr = UI.newBatchDraft.participants;
        var swap = idx + dir;
        if (swap >= 0 && swap < arr.length) { var tmp = arr[idx]; arr[idx] = arr[swap]; arr[swap] = tmp; render(); }
        break;
      }
      case "new-batch-submit": {
        var d = UI.newBatchDraft;
        if (!d.name.trim()) { toast("Give the batch a name."); break; }
        if (!d.amount || Number(d.amount) <= 0) { toast("Enter a contribution amount."); break; }
        if (d.participants.length < 2) { toast("Add at least 2 members."); break; }
        UI.showNewBatch = false;
        mutate("createBatch", { draft: d }, "Batch created.");
        break;
      }
      case "toggle-payment":
        togglePaymentOptimistic(batchId, el.getAttribute("data-payer") || el.getAttribute("data-participant"));
        break;
      case "mark-collected-request": {
        var b = findBatch(batchId);
        if (confirmedCount(b) === currentTotalUnits(b)) {
          mutate("markCollected", { batchId: batchId }, "Marked as collected — next round started.");
        } else {
          UI.confirmCollectFor = batchId; render();
        }
        break;
      }
      case "mark-collected-confirm":
        UI.confirmCollectFor = null;
        mutate("markCollected", { batchId: batchId }, "Marked as collected — next round started.");
        break;
      case "mark-collected-cancel":
        UI.confirmCollectFor = null; render();
        break;
      case "add-participant-open":
        UI.addParticipantOpenFor = batchId; UI.addParticipantDraft = { name:"", phone:"", subNames: [], copayerOpen: false }; render();
        setTimeout(function(){ var i = document.getElementById("add-p-name"); if (i) i.focus(); }, 0);
        break;
      case "add-participant-cancel":
        UI.addParticipantOpenFor = null; render();
        break;
      case "add-participant-submit": {
        var name = UI.addParticipantDraft.name.trim();
        if (!name) { toast("Enter a name."); break; }
        var phone = UI.addParticipantDraft.phone;
        var subNames = UI.addParticipantDraft.subNames;
        UI.addParticipantOpenFor = null;
        mutate("addParticipant", { batchId: batchId, name: name, phone: phone, subNames: subNames }, subNames.length ? "Shared slot added." : "Member added.");
        break;
      }
      case "add-copayer-open":
        UI.addParticipantDraft.copayerOpen = true; render();
        setTimeout(function(){ var i = document.getElementById("add-p-copayer"); if (i) i.focus(); }, 0);
        break;
      case "add-copayer-cancel":
        UI.addParticipantDraft.copayerOpen = false; render();
        break;
      case "add-copayer-add": {
        var cpInput = document.getElementById("add-p-copayer");
        var cpName = cpInput ? cpInput.value.trim() : "";
        if (!cpName) break;
        UI.addParticipantDraft.subNames.push(cpName);
        render();
        setTimeout(function(){ var i = document.getElementById("add-p-copayer"); if (i) i.focus(); }, 0);
        break;
      }
      case "add-copayer-remove":
        UI.addParticipantDraft.subNames.splice(parseInt(el.getAttribute("data-subidx"),10), 1);
        render();
        break;
      case "remove-participant":
        mutate("removeParticipant", { batchId: batchId, participantId: el.getAttribute("data-participant") }, "Member removed.");
        break;
      case "move-participant":
        mutate("moveParticipant", { batchId: batchId, participantId: el.getAttribute("data-participant"), dir: parseInt(el.getAttribute("data-dir"),10) });
        break;
      case "toggle-archive":
        mutate("toggleArchive", { batchId: batchId });
        break;
      case "request-delete-batch":
        UI.confirmDeleteFor = batchId; render();
        break;
      case "cancel-delete-batch":
        UI.confirmDeleteFor = null; render();
        break;
      case "delete-batch":
        UI.view = "home"; UI.batchId = null;
        mutate("deleteBatch", { batchId: batchId }, "Batch deleted.");
        break;
      case "edit-batch-open": {
        var eb = findBatch(batchId);
        if (!eb) break;
        UI.editBatchDraft = { batchId: batchId, name: eb.name, amount: eb.amount, startMonth: eb.startMonth || defaultNextMonth() };
        UI.showEditBatch = true; render();
        setTimeout(function(){ var i = document.getElementById("eb-name"); if (i) i.focus(); }, 0);
        break;
      }
      case "edit-batch-cancel":
        UI.showEditBatch = false; render();
        break;
      case "edit-batch-submit": {
        var ed = UI.editBatchDraft;
        if (!ed.name.trim()) { toast("Give the batch a name."); break; }
        if (!ed.amount || Number(ed.amount) <= 0) { toast("Enter a contribution amount."); break; }
        if (!ed.startMonth) { toast("Choose a first collection month."); break; }
        UI.showEditBatch = false;
        mutate("editBatch", { batchId: ed.batchId, name: ed.name, amount: ed.amount, startMonth: ed.startMonth }, "Batch updated.");
        break;
      }
      case "change-pin-open":
        UI.changePinDraft = { newPin: "", confirmPin: "" };
        UI.showChangePin = true; render();
        setTimeout(function(){ var i = document.getElementById("cp-new"); if (i) i.focus(); }, 0);
        break;
      case "change-pin-cancel":
        UI.showChangePin = false; render();
        break;
      case "change-pin-submit":
        submitChangePin();
        break;
      case "payment-details-open":
        UI.paymentDetailsDraft = {
          accountNumber: (LEDGER.paymentDetails && LEDGER.paymentDetails.accountNumber) || "",
          accountName: (LEDGER.paymentDetails && LEDGER.paymentDetails.accountName) || "",
          bankName: (LEDGER.paymentDetails && LEDGER.paymentDetails.bankName) || ""
        };
        UI.showPaymentDetails = true; render();
        setTimeout(function(){ var i = document.getElementById("pd-number"); if (i) i.focus(); }, 0);
        break;
      case "payment-details-cancel":
        UI.showPaymentDetails = false; render();
        break;
      case "payment-details-submit": {
        var pdDraft = UI.paymentDetailsDraft;
        UI.showPaymentDetails = false;
        guardedAdminAction(function(){ performSavePaymentDetails(pdDraft); });
        break;
      }
      case "share-open":
        UI.showShareFor = batchId;
        render();
        break;
      case "share-cancel":
        UI.showShareFor = null; render();
        break;
      case "share-style":
        UI.shareStyle = el.getAttribute("data-value"); render();
        break;
      case "share-copy": {
        var sb = findBatch(UI.showShareFor);
        if (!sb) break;
        copyToClipboard(buildShareText(sb, UI.shareStyle, LEDGER.paymentDetails));
        break;
      }
      case "share-whatsapp": {
        var sb2 = findBatch(UI.showShareFor);
        if (!sb2) break;
        window.open("https://wa.me/?text=" + encodeURIComponent(buildShareText(sb2, UI.shareStyle, LEDGER.paymentDetails)), "_blank");
        break;
      }
    }
  });

  /* ---------- boot ---------- */
  try {
    var savedPin = localStorage.getItem(PIN_STORAGE_KEY);
    if (savedPin) { ADMIN.pin = savedPin; ADMIN.unlocked = true; }
  } catch(e){}

  refreshLedger();
  setInterval(function(){
    if (!isTypingInField() && !UI.showNewBatch && !UI.showAdminModal) refreshLedger();
  }, REFRESH_MS);
})();
</script>
</body>
</html>
